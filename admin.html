<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>UNBND Admin</title>
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --black: #000000;
    --pink: #fe90ae;
    --white: #ffffff;
    --paper: #f4f4f5;
    --line: #e2e2e6;
    --muted: #686873;
    --error: #d0021b;
    color-scheme: light;
    box-sizing: border-box;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  [hidden] { display: none !important; }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0; background: var(--paper); color: var(--black);
    font: 400 16px/1.55 "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .display { font-family: "Barlow Condensed", "Arial Narrow", sans-serif; }

  /* ---------- Hero ---------- */
  .hero {
    position: relative; overflow: hidden; background: var(--black); color: var(--white);
    padding: calc(env(safe-area-inset-top, 0px) + 18px) 20px 120px;
  }
  /* Running-track lanes sweeping across the hero */
  .hero::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(118deg, transparent 0 46px, rgba(254,144,174,.28) 46px 48px);
    mask-image: linear-gradient(to top, #000 0%, rgba(0,0,0,.35) 45%, transparent 75%);
    -webkit-mask-image: linear-gradient(to top, #000 0%, rgba(0,0,0,.35) 45%, transparent 75%);
  }
  .bar { max-width: 620px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
  .bar img { width: 56px; height: 56px; display: block; }
  .bar .fee { margin: 0; text-align: right; line-height: 1.1; color: rgba(255,255,255,.7); font-size: .85rem; }
  .bar .fee b { display: block; color: var(--pink); font: italic 800 1.6rem/1 "Barlow Condensed", sans-serif; }
  .hero-inner { position: relative; z-index: 1; max-width: 620px; margin: 0 auto; padding-top: 44px; }
  h1 {
    font: italic 800 clamp(3.8rem, 23vw, 7.5rem)/.86 "Barlow Condensed", "Arial Narrow", sans-serif;
    text-transform: uppercase; letter-spacing: -.02em; margin: 0; color: var(--pink);
  }
  .tagline { font: 600 1.3rem/1.3 "Barlow", sans-serif; margin: 18px 0 0; max-width: 26ch; }
  .perks { display: flex; flex-wrap: wrap; gap: 8px; margin: 22px 0 0; padding: 0; list-style: none; }
  .perks li { font-size: .92rem; font-weight: 500; background: rgba(255,255,255,.1); border-radius: 999px; padding: 6px 12px; }

  /* ---------- Form ---------- */
  main { position: relative; z-index: 2; max-width: 620px; margin: -80px auto 0; padding: 0 14px 56px; }
  .card { background: var(--white); border-radius: 22px; padding: 10px 22px 26px; box-shadow: 0 24px 60px -30px rgba(0,0,0,.45); }
  .card-title { font: italic 800 2rem/1 "Barlow Condensed", sans-serif; text-transform: uppercase; margin: 18px 0 2px; }
  .card-sub { color: var(--muted); margin: 0; }
  fieldset { border: 0; padding: 0; margin: 26px 0 0; }
  legend {
    font: 700 1.3rem/1.2 "Barlow Condensed", "Arial Narrow", sans-serif; padding: 0 0 0 12px;
    border-left: 4px solid var(--pink); float: left; width: 100%;
  }
  legend + * { clear: both; }
  .hint { color: var(--muted); font-size: .92rem; margin: 6px 0 0; }

  .field { margin-top: 16px; }
  label.lbl { display: block; font-weight: 600; margin-bottom: 6px; }
  input[type="text"], input[type="tel"], input[type="email"], input[type="number"], select {
    width: 100%; font: inherit; color: var(--black); background: var(--paper);
    border: 1.5px solid transparent; border-radius: 12px; padding: 13px 14px;
    appearance: none; -webkit-appearance: none; transition: border-color .15s, background .15s;
  }
  input:focus, select:focus { background: var(--white); border-color: var(--black); outline: none; }
  select {
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 20px) 55%, calc(100% - 14px) 55%;
    background-size: 6px 6px; background-repeat: no-repeat; padding-right: 40px;
  }
  button:focus-visible, a:focus-visible, .check input:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }
  .invalid input, .invalid select { border-color: var(--error); background: var(--white); }
  .err { color: var(--error); font-size: .9rem; margin: 6px 0 0; }
  .err:empty { display: none; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .sizes { display: flex; flex-wrap: wrap; gap: 8px; }
  .sizes label { position: relative; }
  .sizes input { position: absolute; opacity: 0; inset: 0; }
  .sizes span {
    display: inline-block; min-width: 56px; text-align: center; padding: 11px 12px; background: var(--paper);
    border: 1.5px solid transparent; border-radius: 12px; font: 700 1.05rem/1 "Barlow Condensed", sans-serif; cursor: pointer;
  }
  .sizes input:checked + span { background: var(--black); color: var(--pink); }
  .sizes input:focus-visible + span { outline: 3px solid var(--pink); outline-offset: 2px; }
  .invalid .sizes span { border-color: var(--error); }

  .check { display: flex; gap: 12px; align-items: flex-start; margin-top: 14px; }
  .check input { width: 20px; height: 20px; margin: 2px 0 0; flex: none; accent-color: var(--black); }
  .check.invalid span { color: var(--error); }
  .optional { color: var(--muted); font-weight: 400; }

  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

  .btn {
    display: block; width: 100%; margin-top: 28px; border: 0; border-radius: 14px; padding: 17px 18px;
    font: italic 800 1.35rem/1 "Barlow Condensed", "Arial Narrow", sans-serif; text-transform: uppercase; letter-spacing: .02em;
    background: var(--black); color: var(--pink); cursor: pointer; text-align: center; text-decoration: none;
    transition: transform .12s;
  }
  .btn:active { transform: scale(.98); }
  .btn.pink { background: var(--pink); color: var(--black); }
  .btn[disabled] { opacity: .6; cursor: progress; }
  .summary { margin-top: 18px; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--error); color: var(--error); }
  .summary:empty { display: none; }
  .summary ul { margin: 6px 0 0; padding-left: 20px; }

  /* ---------- Success: race bib ---------- */
  .bib {
    position: relative; background: var(--white); color: var(--black); border-radius: 16px;
    border: 2.5px solid var(--black); padding: 24px 20px 20px; text-align: center; margin: 14px 0 18px;
  }
  .bib::before, .bib::after, .bib .pins::before, .bib .pins::after {
    content: ""; position: absolute; width: 11px; height: 11px; border-radius: 50%; background: var(--paper); border: 2px solid var(--black);
  }
  .bib::before { top: 10px; left: 10px; } .bib::after { top: 10px; right: 10px; }
  .bib .pins::before { bottom: 10px; left: 10px; } .bib .pins::after { bottom: 10px; right: 10px; }
  .bib .club { display: inline-block; background: var(--black); color: var(--pink); font: 700 .95rem/1 "Barlow Condensed", sans-serif; padding: 5px 10px; border-radius: 6px; }
  .bib .num { font: italic 800 clamp(3.6rem, 19vw, 5.4rem)/1 "Barlow Condensed", "Arial Narrow", sans-serif; margin: 8px 0 2px; }
  .bib .who { font-weight: 600; }
  .copy { border: 0; background: var(--paper); color: var(--black); border-radius: 12px; padding: 11px 16px; font: 600 .95rem "Barlow", sans-serif; cursor: pointer; }
  .status { font-weight: 700; margin: 18px 0 0; }
  .status::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--pink); margin-right: 8px; vertical-align: 1px; }
  #done p { margin: 10px 0 0; }

  @media (max-width: 380px) { .row { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: no-preference) {
    h1 { animation: rise .7s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes rise { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
    #done:not([hidden]) .bib { animation: pin .45s cubic-bezier(.2,.8,.2,1.2); }
    @keyframes pin { from { transform: rotate(-4deg) scale(.94); opacity: 0; } to { transform: none; opacity: 1; } }
  }


  /* ---------- Admin ---------- */
  .adminbar { background: var(--black); color: var(--white); padding: calc(env(safe-area-inset-top,0px) + 12px) 16px 12px; }
  .adminbar .in { max-width: 1400px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .adminbar img { width: 42px; height: 42px; }
  .adminbar h1 { font-size: 1.8rem; line-height: 1; animation: none; flex: 1; }
  .linkbtn { background: none; border: 1.5px solid rgba(255,255,255,.35); color: var(--white); border-radius: 10px; padding: 8px 12px; font: 600 .9rem "Barlow", sans-serif; cursor: pointer; }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 16px 14px 48px; }
  .seg { display: flex; background: var(--white); border-radius: 14px; padding: 4px; gap: 4px; overflow-x: auto; }
  .seg button { flex: 1; border: 0; background: none; padding: 11px 12px; border-radius: 10px; font: 700 1.05rem/1 "Barlow Condensed", sans-serif; cursor: pointer; color: var(--muted); white-space: nowrap; }
  .seg button[aria-selected="true"] { background: var(--black); color: var(--pink); }
  .panel { margin-top: 16px; }
  .panel h2.sec { font: italic 800 1.8rem/1 "Barlow Condensed", sans-serif; text-transform: uppercase; margin: 0 0 12px; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .tools input, .tools select { width: auto; flex: 1 1 180px; background: var(--white); padding: 10px 12px; }
  .tools .btn { width: auto; margin: 0; padding: 11px 14px; font-size: 1rem; }
  .counts { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
  .counts span { background: var(--white); border-radius: 999px; padding: 4px 10px; font-weight: 600; font-size: .85rem; }
  .tablewrap { overflow: auto; max-height: 74vh; background: var(--white); border-radius: 12px; border: 1px solid var(--line); }
  table { border-collapse: separate; border-spacing: 0; font-size: .82rem; line-height: 1.3; }
  th, td { padding: 6px 10px; border-bottom: 1px solid rgba(0,0,0,.06); text-align: left; vertical-align: middle; white-space: nowrap; }
  th { position: sticky; top: 0; z-index: 2; background: var(--black); color: var(--white); font: 700 .85rem "Barlow Condensed", sans-serif; }
  td.notes { white-space: pre-line; min-width: 200px; vertical-align: top; }
  td.muted { color: var(--muted); font-style: italic; }
  tr.Active td { background: #eaf8ef; }
  tr.Pending td { background: #fff8dc; }
  tr.Deactivated td { background: #fdecee; }
  .act { position: sticky; left: 0; z-index: 1; border-right: 2px solid rgba(0,0,0,.08); }
  th.act { z-index: 3; }
  .tog { border: 0; border-radius: 8px; padding: 6px 12px; font: 700 .85rem/1 "Barlow Condensed", sans-serif; cursor: pointer; min-width: 88px; }
  .tog.on { background: #0d7a45; color: #fff; }
  .tog.off { background: #c0001f; color: #fff; }
  .tog:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }
  tr.flash td { animation: flash 1.2s; }
  @keyframes flash { from { box-shadow: inset 0 0 0 999px rgba(254,144,174,.35); } }
  .soon { background: var(--white); border-radius: 16px; padding: 22px 18px; color: var(--muted); }
  /* Confirm dialog */
  .modal { position: fixed; inset: 0; z-index: 55; background: rgba(0,0,0,.6); display: grid; place-items: center; padding: 18px; }
  .modal-box { background: var(--white); border-radius: 18px; padding: 22px 20px; width: 100%; max-width: 420px; }
  .modal-box h3 { font: italic 800 1.6rem/1.1 "Barlow Condensed", sans-serif; text-transform: uppercase; margin: 0 0 6px; }
  .modal-box textarea { width: 100%; font: inherit; border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 70px; background: var(--paper); margin-top: 6px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
  .modal-actions button { flex: 1; margin: 0; }
  .ghostbtn { border: 1.5px solid var(--black); background: var(--white); border-radius: 14px; padding: 15px; font: 700 1.1rem/1 "Barlow Condensed", sans-serif; cursor: pointer; }
  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom,0px) + 20px); transform: translateX(-50%); background: var(--black); color: var(--white); padding: 12px 18px; border-radius: 12px; z-index: 60; font-weight: 600; max-width: 90vw; }
  .login { max-width: 380px; margin: 40px auto; }
  /* Gallery */
  .upbox { display: block; background: var(--white); border: 2px dashed var(--line); border-radius: 16px; padding: 22px 16px; text-align: center; cursor: pointer; }
  .upbox:focus-within { outline: 3px solid var(--pink); outline-offset: 2px; }
  .upbox input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .upbox b { display: block; font: italic 800 1.5rem/1.1 "Barlow Condensed", sans-serif; text-transform: uppercase; }
  .upbox span { color: var(--muted); font-size: .9rem; }
  .ghead { display: flex; align-items: baseline; justify-content: space-between; margin: 18px 0 10px; }
  .ghead b { font: 700 1.2rem "Barlow Condensed", sans-serif; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .ph { background: var(--white); border-radius: 12px; overflow: hidden; }
  .ph img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: var(--paper); }
  .ph div { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px; }
  .ph code { font: 700 .85rem "Barlow Condensed", sans-serif; }
  .ph button { border: 0; background: #fdecee; color: #9c0019; border-radius: 8px; padding: 5px 10px; font: 700 .8rem "Barlow Condensed", sans-serif; cursor: pointer; }
  .empty { background: var(--white); border-radius: 12px; padding: 18px; color: var(--muted); }
  .busy { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.72); display: grid; place-items: center; padding: 24px; }
  .busy-box { background: var(--white); border-radius: 18px; padding: 26px 24px; max-width: 320px; text-align: center; }
  .busy-box b { display: block; font: italic 800 1.5rem/1.1 "Barlow Condensed", sans-serif; text-transform: uppercase; margin-top: 14px; }
  .spinner { width: 44px; height: 44px; margin: 0 auto; border-radius: 50%; border: 5px solid var(--paper); border-top-color: var(--pink); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header class="adminbar">
  <div class="in">
    <img src="logo.png" alt="UNBND Run Club">
    <h1>Admin</h1>
    <button class="linkbtn" id="logout" type="button" hidden>Log out</button>
  </div>
</header>

<div class="wrap" id="loginView">
  <form class="card login" id="loginForm" novalidate>
    <h2 class="card-title">Admin login</h2>
    <div class="field">
      <label class="lbl" for="pass">Passcode</label>
      <input id="pass" type="password" autocomplete="current-password">
    </div>
    <div class="summary" id="loginErr" role="alert"></div>
    <button class="btn" type="submit">Log in</button>
  </form>
</div>

<div class="wrap" id="adminView" hidden>
  <div class="seg" role="tablist">
    <button type="button" role="tab" aria-selected="true" data-tab="regPanel">Manage Registrations</button>
    <button type="button" role="tab" aria-selected="false" data-tab="racePanel">Manage Races</button>
    <button type="button" role="tab" aria-selected="false" data-tab="galleryPanel">Manage Gallery</button>
  </div>

  <section class="panel" id="regPanel">
    <h2 class="sec">Manage Registrations</h2>
    <div class="tools">
      <input id="search" type="text" placeholder="Search name, Club ID, phone, email">
      <select id="filter">
        <option value="">All statuses</option>
        <option>Pending</option>
        <option>Active</option>
        <option>Deactivated</option>
      </select>
      <button class="btn pink" id="refresh" type="button">Refresh</button>
      <button class="btn" id="download" type="button">Download Excel</button>
    </div>
    <div class="counts" id="counts"></div>
    <div class="tablewrap"><table id="table"></table></div>
  </section>

  <section class="panel" id="racePanel" hidden>
    <h2 class="sec">Manage Races</h2>
    <div class="soon">Coming next.</div>
  </section>

  <section class="panel" id="galleryPanel" hidden>
    <h2 class="sec">Manage Gallery</h2>
    <label class="upbox">
      <input id="gFiles" type="file" accept="image/*" multiple>
      <b>Add photos</b>
      <span>Choose up to 10 at a time. Photos are resized automatically for the website.</span>
    </label>
    <div class="ghead"><b id="gCount">Photos</b><button class="linkbtn" id="gRefresh" type="button" style="color:var(--black);border-color:var(--line)">Refresh</button></div>
    <div class="grid" id="gGrid"></div>
  </section>
</div>

<!-- Activate / deactivate confirmation with an optional note -->
<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="modal-box">
    <h3 id="mTitle">Activate</h3>
    <p id="mText" style="margin:0"></p>
    <label class="lbl" for="mNote" style="margin-top:14px">Admin note <span class="optional">(optional)</span></label>
    <textarea id="mNote" maxlength="300" placeholder="Leave blank if not needed"></textarea>
    <div class="modal-actions">
      <button class="ghostbtn" id="mCancel" type="button">Cancel</button>
      <button class="btn" id="mOk" type="button">Confirm</button>
    </div>
  </div>
</div>

<div class="busy" id="busy" hidden role="status" aria-live="polite">
  <div class="busy-box"><div class="spinner" aria-hidden="true"></div><b id="busyText">Please wait</b></div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbzbZCKBa3tIQuXVny1OIx8zpiELks2FqMlwbj6GoEckWIxiJZ-YT0oqfEPfymbl80gG/exec";
  const $ = (id) => document.getElementById(id);
  const esc = (t) => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  let passcode = "";
  let headers = [], rows = [], refs = [];

  async function api(payload, busyText) {
    if (busyText) { $("busyText").textContent = busyText; $("busy").hidden = false; }
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 40000);
      const res = await fetch(API_URL, {
        method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(Object.assign({ passcode: passcode }, payload)), signal: ctrl.signal,
      });
      clearTimeout(timer);
      const out = JSON.parse(await res.text());
      if (out.auth === false && !$("adminView").hidden) logout(out.errors && out.errors[0]);
      return out;
    } catch (e) {
      return { ok: false, errors: [e.name === "AbortError" ? "This took too long. Please try again." : "Couldn't reach the server. Check your internet and try again."] };
    } finally {
      if (busyText) $("busy").hidden = true;
    }
  }
  function toast(msg) {
    $("toast").textContent = msg; $("toast").hidden = false;
    clearTimeout(toast.t); toast.t = setTimeout(() => ($("toast").hidden = true), 2800);
  }

  // ---------- Login ----------
  $("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    passcode = $("pass").value;
    $("loginErr").textContent = "";
    const out = await api({ action: "adminList" }, "Logging in");
    if (!out.ok) { passcode = ""; $("loginErr").textContent = (out.errors || ["Login failed."])[0]; return; }
    try { sessionStorage.setItem("unbnd_admin", passcode); } catch (x) {}
    enter(out);
  });
  function enter(out) {
    $("loginView").hidden = true; $("adminView").hidden = false; $("logout").hidden = false;
    $("pass").value = "";
    setData(out);
  }
  function logout(msg) {
    passcode = ""; headers = []; rows = []; refs = [];
    try { sessionStorage.removeItem("unbnd_admin"); sessionStorage.removeItem("unbnd_admin_data"); } catch (x) {}
    $("adminView").hidden = true; $("loginView").hidden = false; $("logout").hidden = true;
    $("table").innerHTML = "";
    if (msg) $("loginErr").textContent = msg;
  }
  $("logout").addEventListener("click", () => logout());

  // ---------- Tabs ----------
  document.querySelectorAll(".seg button").forEach((b) => b.addEventListener("click", () => {
    document.querySelectorAll(".seg button").forEach((x) => {
      x.setAttribute("aria-selected", String(x === b));
      $(x.dataset.tab).hidden = x !== b;
    });
  }));

  // ---------- Manage Registrations ----------
  function setData(out) {
    headers = out.headers; rows = out.rows; refs = out.refs || [];
    try { sessionStorage.setItem("unbnd_admin_data", JSON.stringify({ headers: headers, rows: rows, refs: refs })); } catch (x) {}
    render();
  }
  $("refresh").addEventListener("click", async () => {
    const out = await api({ action: "adminList" }, "Refreshing");
    if (out.ok) { setData(out); toast("Up to date"); } else toast((out.errors || ["Refresh failed"])[0]);
  });
  $("search").addEventListener("input", render);
  $("filter").addEventListener("change", render);
  setInterval(async () => {
    if (!passcode || document.hidden || !$("modal").hidden) return;
    const out = await api({ action: "adminList" });
    if (out.ok && $("modal").hidden) setData(out);
  }, 60000);

  const iOf = (name) => headers.indexOf(name);
  function render() {
    const iStatus = iOf("Membership status"), iNotes = iOf("Admin notes");
    const q = $("search").value.trim().toLowerCase();
    const f = $("filter").value;
    const counts = { Pending: 0, Active: 0, Deactivated: 0 };
    rows.forEach((r) => { if (counts[r[iStatus]] !== undefined) counts[r[iStatus]]++; });
    $("counts").innerHTML = "<span>Total " + rows.length + "</span>" +
      Object.keys(counts).map((k) => "<span>" + k + " " + counts[k] + "</span>").join("");

    let h = '<thead><tr><th class="act">Action</th>' + headers.map((x) => "<th>" + esc(x) + "</th>").join("") + "</tr></thead><tbody>";
    let shown = 0;
    rows.forEach((r, k) => {
      const st = r[iStatus];
      if ((f && st !== f) || (q && !r.join(" ").toLowerCase().includes(q))) return;
      shown++;
      const activate = st !== "Active";
      h += '<tr class="' + esc(st) + '" data-k="' + k + '"><td class="act"><button type="button" class="tog ' + (activate ? "on" : "off") + '">' +
        (activate ? "Activate" : "Deactivate") + "</button></td>";
      r.forEach((v, i) => {
        if (i === iNotes) h += v ? '<td class="notes">' + esc(v) + "</td>" : '<td class="notes muted">No admin remarks</td>';
        else h += "<td>" + (v === "" ? "" : esc(v)) + "</td>";
      });
      h += "</tr>";
    });
    if (!shown) h += '<tr><td class="act muted" colspan="' + (headers.length + 1) + '">No matching registrations</td></tr>';
    $("table").innerHTML = h + "</tbody>";
  }

  // Toggle: opens a small confirm box with an optional note
  let pending = null;
  $("table").addEventListener("click", (e) => {
    const btn = e.target.closest(".tog"); if (!btn) return;
    const k = Number(btn.closest("tr").dataset.k);
    const r = rows[k];
    const toActive = r[iOf("Membership status")] !== "Active";
    const name = r[iOf("Full name")], id = r[iOf("Club ID")];
    pending = { k: k, status: toActive ? "Active" : "Deactivated" };
    $("mTitle").textContent = toActive ? "Activate member" : "Deactivate member";
    $("mText").textContent = (id ? id + " · " : "") + name +
      (toActive && !id ? ". A Club ID will be assigned and the welcome email sent." : "");
    $("mOk").textContent = toActive ? "Activate" : "Deactivate";
    $("mNote").value = "";
    $("modal").hidden = false;
    $("mNote").focus();
  });
  $("mCancel").addEventListener("click", () => { $("modal").hidden = true; pending = null; });
  $("mOk").addEventListener("click", async () => {
    if (!pending) return;
    const p = pending; pending = null;
    $("modal").hidden = true;
    const out = await api({ action: "adminUpdate", ref: refs[p.k], status: p.status, note: $("mNote").value.trim() },
      p.status === "Active" ? "Activating" : "Deactivating");
    if (!out.ok) { toast((out.errors || ["Update failed"])[0]); return; }
    rows[p.k] = out.row;
    render();
    const tr = $("table").querySelector('tr[data-k="' + p.k + '"]');
    if (tr) tr.classList.add("flash");
    const id = out.row[iOf("Club ID")];
    toast(p.status === "Active" ? (id + " activated") : "Deactivated");
  });

  // ---------- Excel download ----------
  $("download").addEventListener("click", () => {
    if (!window.XLSX) { toast("Excel download isn't available right now. Try refreshing the page."); return; }
    const ws = XLSX.utils.aoa_to_sheet([headers].concat(rows));
    ws["!cols"] = headers.map((h) => ({ wch: Math.min(40, Math.max(12, h.length + 2)) }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Members");
    const d = new Date(), pad = (n) => String(n).padStart(2, "0");
    XLSX.writeFile(wb, "UNBND-members-" + d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + ".xlsx");
  });


  // ---------- Manage Gallery ----------
  const G_MAX_SIDE = 1920, G_QUALITY = 0.82, G_BATCH = 10;
  let photos = [], galleryLoaded = false;

  async function loadGallery(busyText) {
    const out = await api({ action: "adminGalleryList" }, busyText);
    if (!out.ok) { toast((out.errors || ["Couldn't load photos"])[0]); return; }
    photos = out.photos; galleryLoaded = true; renderGallery();
  }
  function renderGallery() {
    $("gCount").textContent = photos.length + (photos.length === 1 ? " photo" : " photos");
    $("gGrid").innerHTML = photos.length ? photos.map((p) =>
      '<div class="ph"><img loading="lazy" src="' + esc(p.thumb) + '" alt="Gallery photo ' + esc(p.id) + '">' +
      '<div><code>' + esc(p.id) + '</code><button type="button" data-del="' + esc(p.id) + '">Delete</button></div></div>'
    ).join("") : '<div class="empty">No photos yet.</div>';
  }
  document.querySelector('[data-tab="galleryPanel"]').addEventListener("click", () => { if (!galleryLoaded) loadGallery("Loading photos"); });
  $("gRefresh").addEventListener("click", () => loadGallery("Refreshing"));

  function compressPhoto(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, G_MAX_SIDE / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
        const x = c.getContext("2d");
        x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height);
        x.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL("image/jpeg", G_QUALITY).split(",")[1]);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(); };
      img.src = url;
    });
  }

  $("gFiles").addEventListener("change", async () => {
    const files = [...$("gFiles").files].filter((f) => /^image\//.test(f.type)).slice(0, G_BATCH);
    $("gFiles").value = "";
    if (!files.length) return;
    let done = 0, failed = 0;
    for (let i = 0; i < files.length; i++) {
      let data;
      try { data = await compressPhoto(files[i]); } catch (e) { failed++; continue; }
      const out = await api({ action: "adminGalleryUpload", mimeType: "image/jpeg", data: data }, "Uploading " + (i + 1) + " of " + files.length);
      if (out.ok) { photos.unshift(out.photo); done++; renderGallery(); } else failed++;
    }
    galleryLoaded = true;
    toast(done + " uploaded" + (failed ? ", " + failed + " failed" : ""));
  });

  $("gGrid").addEventListener("click", async (e) => {
    const btn = e.target.closest("[data-del]"); if (!btn) return;
    const id = btn.dataset.del;
    if (!confirm("Delete photo " + id + " from the gallery?")) return;
    const out = await api({ action: "adminGalleryDelete", photoId: id }, "Deleting " + id);
    if (!out.ok) { toast((out.errors || ["Delete failed"])[0]); return; }
    photos = photos.filter((p) => p.id !== id); renderGallery();
    toast(id + " deleted");
  });

  // ---------- Stay logged in while this tab is open ----------
  (async () => {
    let saved = ""; try { saved = sessionStorage.getItem("unbnd_admin") || ""; } catch (x) {}
    if (!saved) return;
    passcode = saved;
    let cached = null; try { cached = JSON.parse(sessionStorage.getItem("unbnd_admin_data") || "null"); } catch (x) {}
    if (cached && cached.refs) enter(cached);
    const out = await api({ action: "adminList" }, cached ? "" : "Loading");
    if (out.ok) { if (cached) setData(out); else enter(out); } else if (!cached) logout();
  })();
</script>
</body>
</html>
