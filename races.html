<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Race schedule | UNBND Run Club</title>
<meta name="description" content="Upcoming UNBND Run Club races. Free for all members with an active Club ID.">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #000000;
    --pink: #fe90ae;
    --white: #ffffff;
    --paper: #f4f4f5;
    --line: #e2e2e6;
    --muted: #686873;
    --error: #d0021b;
    color-scheme: light;
    box-sizing: border-box;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  [hidden] { display: none !important; }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0; background: var(--paper); color: var(--black);
    font: 400 16px/1.55 "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .display { font-family: "Barlow Condensed", "Arial Narrow", sans-serif; }

  /* ---------- Hero ---------- */
  .hero {
    position: relative; overflow: hidden; background: var(--black); color: var(--white);
    padding: calc(env(safe-area-inset-top, 0px) + 18px) 20px 120px;
  }
  /* Running-track lanes sweeping across the hero */
  .hero::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(118deg, transparent 0 46px, rgba(254,144,174,.28) 46px 48px);
    mask-image: linear-gradient(to top, #000 0%, rgba(0,0,0,.35) 45%, transparent 75%);
    -webkit-mask-image: linear-gradient(to top, #000 0%, rgba(0,0,0,.35) 45%, transparent 75%);
  }
  .bar { max-width: 620px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
  .bar img { width: 56px; height: 56px; display: block; }
  .bar .fee { margin: 0; text-align: right; line-height: 1.1; color: rgba(255,255,255,.7); font-size: .85rem; }
  .bar .fee b { display: block; color: var(--pink); font: italic 800 1.6rem/1 "Barlow Condensed", sans-serif; }
  .hero-inner { position: relative; z-index: 1; max-width: 620px; margin: 0 auto; padding-top: 44px; }
  h1 {
    font: italic 800 clamp(3.8rem, 23vw, 7.5rem)/.86 "Barlow Condensed", "Arial Narrow", sans-serif;
    text-transform: uppercase; letter-spacing: -.02em; margin: 0; color: var(--pink);
  }
  .tagline { font: 600 1.3rem/1.3 "Barlow", sans-serif; margin: 18px 0 0; max-width: 26ch; }
  .perks { display: flex; flex-wrap: wrap; gap: 8px; margin: 22px 0 0; padding: 0; list-style: none; }
  .perks li { font-size: .92rem; font-weight: 500; background: rgba(255,255,255,.1); border-radius: 999px; padding: 6px 12px; }

  /* ---------- Form ---------- */
  main { position: relative; z-index: 2; max-width: 620px; margin: -80px auto 0; padding: 0 14px 56px; }
  .card { background: var(--white); border-radius: 22px; padding: 10px 22px 26px; box-shadow: 0 24px 60px -30px rgba(0,0,0,.45); }
  .card-title { font: italic 800 2rem/1 "Barlow Condensed", sans-serif; text-transform: uppercase; margin: 18px 0 2px; }
  .card-sub { color: var(--muted); margin: 0; }
  fieldset { border: 0; padding: 0; margin: 26px 0 0; }
  legend {
    font: 700 1.3rem/1.2 "Barlow Condensed", "Arial Narrow", sans-serif; padding: 0 0 0 12px;
    border-left: 4px solid var(--pink); float: left; width: 100%;
  }
  legend + * { clear: both; }
  .hint { color: var(--muted); font-size: .92rem; margin: 6px 0 0; }

  .field { margin-top: 16px; }
  label.lbl { display: block; font-weight: 600; margin-bottom: 6px; }
  input[type="text"], input[type="tel"], input[type="email"], input[type="number"], select {
    width: 100%; font: inherit; color: var(--black); background: var(--paper);
    border: 1.5px solid transparent; border-radius: 12px; padding: 13px 14px;
    appearance: none; -webkit-appearance: none; transition: border-color .15s, background .15s;
  }
  input:focus, select:focus { background: var(--white); border-color: var(--black); outline: none; }
  select {
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 20px) 55%, calc(100% - 14px) 55%;
    background-size: 6px 6px; background-repeat: no-repeat; padding-right: 40px;
  }
  button:focus-visible, a:focus-visible, .check input:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }
  .invalid input, .invalid select { border-color: var(--error); background: var(--white); }
  .err { color: var(--error); font-size: .9rem; margin: 6px 0 0; }
  .err:empty { display: none; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .sizes { display: flex; flex-wrap: wrap; gap: 8px; }
  .sizes label { position: relative; }
  .sizes input { position: absolute; opacity: 0; inset: 0; }
  .sizes span {
    display: inline-block; min-width: 56px; text-align: center; padding: 11px 12px; background: var(--paper);
    border: 1.5px solid transparent; border-radius: 12px; font: 700 1.05rem/1 "Barlow Condensed", sans-serif; cursor: pointer;
  }
  .sizes input:checked + span { background: var(--black); color: var(--pink); }
  .sizes input:focus-visible + span { outline: 3px solid var(--pink); outline-offset: 2px; }
  .invalid .sizes span { border-color: var(--error); }

  .check { display: flex; gap: 12px; align-items: flex-start; margin-top: 14px; }
  .check input { width: 20px; height: 20px; margin: 2px 0 0; flex: none; accent-color: var(--black); }
  .check.invalid span { color: var(--error); }
  .optional { color: var(--muted); font-weight: 400; }

  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

  .btn {
    display: block; width: 100%; margin-top: 28px; border: 0; border-radius: 14px; padding: 17px 18px;
    font: italic 800 1.35rem/1 "Barlow Condensed", "Arial Narrow", sans-serif; text-transform: uppercase; letter-spacing: .02em;
    background: var(--black); color: var(--pink); cursor: pointer; text-align: center; text-decoration: none;
    transition: transform .12s;
  }
  .btn:active { transform: scale(.98); }
  .btn.pink { background: var(--pink); color: var(--black); }
  .btn[disabled] { opacity: .6; cursor: progress; }
  .summary { margin-top: 18px; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--error); color: var(--error); }
  .summary:empty { display: none; }
  .summary ul { margin: 6px 0 0; padding-left: 20px; }

  /* ---------- Success: race bib ---------- */
  .bib {
    position: relative; background: var(--white); color: var(--black); border-radius: 16px;
    border: 2.5px solid var(--black); padding: 24px 20px 20px; text-align: center; margin: 14px 0 18px;
  }
  .bib::before, .bib::after, .bib .pins::before, .bib .pins::after {
    content: ""; position: absolute; width: 11px; height: 11px; border-radius: 50%; background: var(--paper); border: 2px solid var(--black);
  }
  .bib::before { top: 10px; left: 10px; } .bib::after { top: 10px; right: 10px; }
  .bib .pins::before { bottom: 10px; left: 10px; } .bib .pins::after { bottom: 10px; right: 10px; }
  .bib .club { display: inline-block; background: var(--black); color: var(--pink); font: 700 .95rem/1 "Barlow Condensed", sans-serif; padding: 5px 10px; border-radius: 6px; }
  .bib .num { font: italic 800 clamp(3.6rem, 19vw, 5.4rem)/1 "Barlow Condensed", "Arial Narrow", sans-serif; margin: 8px 0 2px; }
  .bib .who { font-weight: 600; }
  .copy { border: 0; background: var(--paper); color: var(--black); border-radius: 12px; padding: 11px 16px; font: 600 .95rem "Barlow", sans-serif; cursor: pointer; }
  .status { font-weight: 700; margin: 18px 0 0; }
  .status::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--pink); margin-right: 8px; vertical-align: 1px; }
  #done p { margin: 10px 0 0; }

  @media (max-width: 380px) { .row { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: no-preference) {
    h1 { animation: rise .7s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes rise { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
    #done:not([hidden]) .bib { animation: pin .45s cubic-bezier(.2,.8,.2,1.2); }
    @keyframes pin { from { transform: rotate(-4deg) scale(.94); opacity: 0; } to { transform: none; opacity: 1; } }
  }

  .nav { position: relative; z-index: 3; max-width: 1080px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .nav img { width: 56px; height: 56px; display: block; }
  .nav .links { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  .nav .links a { color: var(--white); text-decoration: none; font: 700 1rem/1 "Barlow Condensed", sans-serif; padding: 9px 12px; border-radius: 999px; }
  .nav .links a:hover, .nav .links a[aria-current="page"] { background: rgba(255,255,255,.14); }
  .nav .links a.cta { background: var(--pink); color: var(--black); }
  .wide { max-width: 1080px; margin: 0 auto; }
  .facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .facts div { background: var(--paper); border-radius: 12px; padding: 10px 12px; }
  .facts small { display: block; color: var(--muted); font-size: .8rem; }
  .facts b { font: 700 1.05rem/1.25 "Barlow", sans-serif; }
  .free { background: #eaf8ef; color: #0b5e36; border-radius: 12px; padding: 12px 14px; font-weight: 600; margin: 14px 0 0; }
  .rich ul { margin: 4px 0 0; padding-left: 20px; } .rich p { margin: 4px 0; }
  .countdown { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 4px 0 16px; max-width: 460px; }
  .countdown div { background: var(--black); color: var(--white); border-radius: 14px; padding: 12px 6px 10px; text-align: center; }
  .countdown b { display: block; font: italic 800 clamp(2rem, 9vw, 3rem)/1 "Barlow Condensed", sans-serif; color: var(--pink); font-variant-numeric: tabular-nums; }
  .countdown span { font-size: .75rem; color: rgba(255,255,255,.75); text-transform: uppercase; letter-spacing: .08em; }
  .livebadge { display: inline-block; background: var(--pink); color: var(--black); font: 700 1.1rem/1 "Barlow Condensed", sans-serif; padding: 10px 14px; border-radius: 999px; margin: 4px 0 16px; }
  .site-foot { background: var(--black); color: rgba(255,255,255,.75); padding: 28px 18px calc(env(safe-area-inset-bottom,0px) + 28px); margin-top: 40px; }
  .site-foot .wide { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; }
  .site-foot a { color: var(--pink); font-weight: 700; text-decoration: none; }

  .hero { padding-bottom: 90px; }
  .hero-inner { max-width: 1080px; padding-top: 30px; }
  h1 { font-size: clamp(3.2rem, 16vw, 6.5rem); }
  main { max-width: 1080px; margin-top: -60px; }
  .feat { background: var(--white); border-radius: 22px; overflow: hidden; box-shadow: 0 24px 60px -30px rgba(0,0,0,.45); }
  .feat .cover { position: relative; min-height: 280px; background: #000 center / cover no-repeat; display: flex; align-items: flex-end; }
  .feat .cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.85) 5%, rgba(0,0,0,.1) 75%); }
  .feat .cover .t { position: relative; z-index: 1; padding: 20px; }
  .kicker { display: inline-block; background: var(--pink); color: var(--black); font: 700 .9rem/1 "Barlow Condensed", sans-serif; padding: 6px 10px; border-radius: 6px; }
  .feat h2 { font: italic 800 clamp(2.4rem, 10vw, 4.4rem)/.92 "Barlow Condensed", sans-serif; text-transform: uppercase; color: var(--white); margin: 10px 0 0; }
  .feat .body { padding: 18px 20px 24px; }
  .feat h3, .rc h3 { font: 700 1.25rem "Barlow Condensed", sans-serif; margin: 18px 0 4px; }
  .maplink { display: inline-block; margin-top: 8px; font-weight: 700; color: var(--black); }
  .more { margin-top: 26px; }
  .more > h2 { font: italic 800 2rem/1 "Barlow Condensed", sans-serif; text-transform: uppercase; margin: 0 0 12px; }
  .rgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
  .rc { background: var(--white); border-radius: 18px; overflow: hidden; }
  .rc .cover { height: 150px; background: #000 center / cover no-repeat; position: relative; }
  .rc .cover b { position: absolute; left: 12px; top: 12px; background: var(--black); color: var(--pink); font: 700 .95rem/1 "Barlow Condensed", sans-serif; padding: 6px 10px; border-radius: 8px; }
  .rc .body { padding: 14px 16px 18px; }
  .rc h4 { font: italic 800 1.7rem/1 "Barlow Condensed", sans-serif; text-transform: uppercase; margin: 0 0 10px; }
  .rc details { margin-top: 12px; } .rc summary { cursor: pointer; font-weight: 700; }
  .state { background: var(--white); border-radius: 18px; padding: 26px 20px; text-align: center; }
  .state b { display: block; font: italic 800 1.8rem/1.1 "Barlow Condensed", sans-serif; text-transform: uppercase; margin-bottom: 6px; }
  .skeleton { height: 360px; border-radius: 22px; background: linear-gradient(90deg, #e6e6ea, #f3f3f5, #e6e6ea); background-size: 200% 100%; animation: sk 1.2s infinite linear; }
  @keyframes sk { to { background-position: -200% 0; } }
</style>
</head>
<body>
<section class="hero">
  <nav class="nav">
    <a href="index.html"><img src="logo.png" alt="UNBND Run Club home"></a>
    <div class="links"><a href="index.html">Home</a><a href="races.html" aria-current="page">Races</a><a class="cta" href="register.html">Join</a></div>
  </nav>
  <div class="hero-inner">
    <h1>Race<br>schedule</h1>
    <p class="tagline">Every race is free for members with an active Club ID. Pick your start line.</p>
  </div>
</section>

<main>
  <div id="featured"><div class="skeleton" aria-label="Loading races"></div></div>
  <div class="more" id="moreWrap" hidden><h2>More upcoming races</h2><div class="rgrid" id="more"></div></div>
</main>

<footer class="site-foot"><div class="wide"><span>UNBND Run Club</span><span>Follow us on Instagram <a href="https://www.instagram.com/unbndrunclub/">@unbndrunclub</a></span></div></footer>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbzbZCKBa3tIQuXVny1OIx8zpiELks2FqMlwbj6GoEckWIxiJZ-YT0oqfEPfymbl80gG/exec";

  const $ = (id) => document.getElementById(id);
  const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const esc = (t) => String(t == null ? "" : t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const niceDate = (iso) => { const [y, m, d] = iso.split("-").map(Number); return d + " " + MONTHS[m - 1] + " " + y; };
  const time12 = (t) => { const [H, M] = t.split(":").map(Number); return (H % 12 || 12) + ":" + String(M).padStart(2, "0") + " " + (H < 12 ? "AM" : "PM"); };
  const raceStart = (r) => new Date(r.date + "T" + r.time + ":00+05:30");
  function duration(r) {
    const h = Number(r.hours) || 0, m = Number(r.minutes) || 0;
    return (h || m) ? ((h ? h + " hr " : "") + (m ? m + " min" : "")).trim() : "";
  }
  function ageText(r) {
    return r.minAge && r.maxAge ? r.minAge + " to " + r.maxAge + " years" : r.minAge ? r.minAge + "+ years" : r.maxAge ? "Up to " + r.maxAge + " years" : "All ages";
  }
  function richText(t) {
    const lines = String(t || "").split("\n").map((l) => l.trim()).filter(Boolean);
    let h = "", list = [];
    const flush = () => { if (list.length) { h += "<ul>" + list.map((x) => "<li>" + esc(x) + "</li>").join("") + "</ul>"; list = []; } };
    lines.forEach((l) => { if (/^[-•*]\s*/.test(l)) list.push(l.replace(/^[-•*]\s*/, "")); else { flush(); h += "<p>" + esc(l) + "</p>"; } });
    flush(); return h;
  }
  function factsHtml(r) {
    const f = (k, v) => v ? "<div><small>" + k + "</small><b>" + esc(v) + "</b></div>" : "";
    return '<div class="facts">' + f("Date", r.day + ", " + niceDate(r.date)) + f("Reporting time", time12(r.time)) +
      f("Duration", duration(r)) + f("Distance", r.distance ? r.distance + " km" : "") + f("Age", ageText(r)) + "</div>";
  }
  function tickCountdowns() {
    document.querySelectorAll("[data-count]").forEach((el) => {
      const ms = new Date(el.dataset.count) - new Date();
      if (ms <= 0) { el.outerHTML = '<p class="livebadge">Race day is here</p>'; return; }
      const d = Math.floor(ms / 864e5), h = Math.floor(ms / 36e5) % 24, m = Math.floor(ms / 6e4) % 60, s = Math.floor(ms / 1e3) % 60;
      el.innerHTML = [[d, "Days"], [h, "Hours"], [m, "Mins"], [s, "Secs"]]
        .map((x) => "<div><b>" + String(x[0]).padStart(2, "0") + "</b><span>" + x[1] + "</span></div>").join("");
    });
  }
  async function post(payload, timeoutMs) {
    const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), timeoutMs || 30000);
    try {
      const res = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload), signal: ctrl.signal });
      return JSON.parse(await res.text());
    } catch (e) { return { ok: false, errors: [e.name === "AbortError" ? "This is taking too long. Please try again." : "We couldn't reach the server. Check your internet and try again."] }; }
    finally { clearTimeout(timer); }
  }
  async function fetchRaces() { const out = await post({ action: "races" }); return out.ok ? out.races : null; }

  function startBlock(r) {
    return "<h3>Starting point</h3><p style='margin:0'>" + esc(r.start) + (r.landmark ? "<br><span style='color:var(--muted)'>" + esc(r.landmark) + "</span>" : "") + "</p>" +
      (r.map ? '<a class="maplink" href="' + esc(r.map) + '" target="_blank" rel="noopener">Get directions</a>' : "");
  }
  function extras(r) {
    return (r.activities ? "<h3>Additional activities</h3><div class='rich'>" + richText(r.activities) + "</div>" : "") +
      (r.goodies ? "<h3>Goodies and awards</h3><div class='rich'>" + richText(r.goodies) + "</div>" : "");
  }
  (async () => {
    const list = await fetchRaces();
    if (!list) { $("featured").innerHTML = '<div class="state"><b>Couldn\'t load races</b>Check your connection and refresh the page.</div>'; return; }
    if (!list.length) { $("featured").innerHTML = '<div class="state"><b>No races scheduled yet</b>New races are announced here and on Instagram <a href="https://www.instagram.com/unbndrunclub/">@unbndrunclub</a>.</div>'; return; }
    const r = list[0];
    $("featured").innerHTML =
      '<article class="feat"><div class="cover" style="' + (r.photo ? "background-image:url('" + esc(r.photo) + "')" : "") + '"><div class="t">' +
      '<span class="kicker">Next race · ' + esc(r.id) + "</span><h2>" + esc(r.name) + "</h2></div></div>" +
      '<div class="body"><div class="countdown" data-count="' + raceStart(r).toISOString() + '" aria-label="Time until reporting"></div>' +
      factsHtml(r) + startBlock(r) + '<p class="free">Free for all members with an active Club ID.</p>' + extras(r) + "</div></article>";
    if (list.length > 1) {
      $("moreWrap").hidden = false;
      $("more").innerHTML = list.slice(1).map((x) =>
        '<article class="rc"><div class="cover" style="' + (x.photo ? "background-image:url('" + esc(x.thumb || x.photo) + "')" : "") + '"><b>' + esc(x.id) + "</b></div>" +
        '<div class="body"><h4>' + esc(x.name) + "</h4>" + factsHtml(x) +
        "<details><summary>More details</summary>" + startBlock(x) + extras(x) + "</details>" +
        '<p class="free">Free for all members with an active Club ID.</p></div></article>').join("");
    }
    tickCountdowns(); setInterval(tickCountdowns, 1000);
  })();
</script>
</body>
</html>
